# =============================================================================
# case_01.yaml - PLAYER-FACING CASE DATA ("The Holdout")
# Everything in this file may be embedded in Pinecone. The hidden truth lives in
# solution.json and must never be embedded or shown to a suspect node.
#
# Fact chunk schema (one Pinecone record per chunk):
#   id                F01..F30
#   type              evidence type (incident_report, slack_message, access_log, ...)
#   title             short label
#   day / time        when the fact happened: ISO date; HH:MM[:SS] or HH:MM-HH:MM (Pacific Time) or null
#   location          canonical location from vocabulary.locations, or null
#   entities          lowercase ids of people / objects / systems mentioned (for query rewriting)
#   known_by          who may retrieve it: suspect ids or channels (records, scene, forensics, case_file)
#   reveal_condition  list of clue ids that must ALL be discovered first; [] = freely available
#   clue_id           clue unlocked by finding this chunk, or null
#   text              the text that gets embedded
# =============================================================================
schema_version: "1.0"

case:
